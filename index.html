<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galaxia del Amor • Amelia</title>
<style>
body,html{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
.player{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  width:90%;max-width:600px;display:flex;align-items:center;gap:10px;
  padding:10px;border:2px solid #f60;border-radius:999px;background:0 0;
  box-shadow:0 0 15px #f60,0 0 30px #f30;z-index:1000;
  font-family:Arial,sans-serif;color:#fff;font-size:14px
}
.player button{
  background:0 0;border:none;color:#fff;font-size:22px;cursor:pointer;
  filter:drop-shadow(0 0 6px #ff6600);transition:transform .2s
}
.player button:hover{transform:scale(1.2);filter:drop-shadow(0 0 10px #ff3300)}
.progress{
  flex-grow:1;height:14px;background:rgba(255,255,255,.12);
  border-radius:999px;overflow:hidden;cursor:pointer;position:relative
}
.progress-bar{
  height:100%;width:0%;
  background:linear-gradient(270deg,#f60,#f30,#f09,#f60);
  background-size:400% 400%;border-radius:999px;
  box-shadow:0 0 10px #f60;animation:flowing 6s ease infinite
}
@keyframes flowing{
  0%{background-position:0 50%}
  50%{background-position:100% 50%}
  100%{background-position:0 50%}
}
.time{
  min-width:74px;text-align:right;font-size:12px;color:#fff;
  text-shadow:0 0 5px #f60
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="player">
  <button id="play">▶️</button>
  <div class="progress" id="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="time" id="time">0:00 / 0:00</div>
</div>
<audio id="audio" loop>
  <source src="https://www.dropbox.com/scl/fi/x8x4s657po48yqepu94gr/latin-mafia-cancion.mp3?rlkey=ypdkn2r80zfb7di5fi24jjtei&st=gobgoeet&raw=1" type="audio/mpeg">
</audio>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
const audio = document.getElementById("audio"),
      playBtn = document.getElementById("play"),
      progress = document.getElementById("progress"),
      progressBar = document.getElementById("progress-bar"),
      timeDisplay = document.getElementById("time");

let isPlaying = false;

function formatTime(e) {
  if (!isFinite(e)) return "0:00";
  return Math.floor(e / 60) + ":" + Math.floor(e % 60).toString().padStart(2, "0");
}

playBtn.addEventListener("click", async () => {
  if (isPlaying) {
    audio.pause();
    playBtn.textContent = "▶️";
  } else {
    await audio.play();
    playBtn.textContent = "⏸️";
  }
  isPlaying = !isPlaying;
});

audio.addEventListener("timeupdate", () => {
  const e = audio.currentTime / audio.duration * 100;
  progressBar.style.width = (isFinite(e) ? e : 0) + "%";
  timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
});

progress.addEventListener("click", e => {
  const t = progress.getBoundingClientRect(),
        n = (e.clientX - t.left) / t.width;
  if (isFinite(audio.duration)) audio.currentTime = n * audio.duration;
});

const canvas = document.getElementById("c"),
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene,
      camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);

let targetDist = 320,
    currentDist = 320,
    rotX = 0.15,
    rotY = 0;

const loader = new THREE.TextureLoader;
const nebulaTex = loader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/cube/space/px.jpg");
scene.background = nebulaTex;

// Stars
(function(e = 2200, t = 3200) {
  const n = new THREE.BufferGeometry,
        a = new Float32Array(3 * e);
  for (let n = 0; n < e; n++) {
    const e = t * (0.3 + 0.7 * Math.random()),
          r = Math.random() * Math.PI * 2,
          i = Math.acos(2 * Math.random() - 1);
    a[3 * n + 0] = e * Math.sin(i) * Math.cos(r);
    a[3 * n + 1] = e * Math.cos(i);
    a[3 * n + 2] = e * Math.sin(i) * Math.sin(r);
  }
  n.setAttribute("position", new THREE.BufferAttribute(a, 3));
  scene.add(new THREE.Points(n, new THREE.PointsMaterial({ size: 1.4, color: 16777215, depthWrite: false })));
})();

// Small dark core (so it feels like a planet, not covering the photo)
const coreMat = new THREE.MeshBasicMaterial({ color: 0x030303, transparent: true, opacity: 0.9 }),
      core = new THREE.Mesh(new THREE.SphereGeometry(12, 32, 32), coreMat);
scene.add(core);

const centerMat = new THREE.SpriteMaterial({ 
  map: centerTex, 
  transparent: true, 
  depthWrite: false, 
  depthTest: false 
});
const centerSprite = new THREE.Sprite(centerMat);
const PHOTO_SCALE = 110;
centerSprite.scale.set(PHOTO_SCALE, PHOTO_SCALE, 1);
centerSprite.position.set(0, 0, 0);
centerSprite.renderOrder = 1000;
scene.add(centerSprite);

// Soft orange glow behind the planet
function makeGlow(e = 768, t = "255,140,30", n = "255,60,10") {
  const a = document.createElement("canvas");
  a.width = a.height = e;
  const r = a.getContext("2d"),
        i = r.createRadialGradient(e / 2, e / 2, 0.08 * e, e / 2, e / 2, 0.55 * e);
  i.addColorStop(0, "rgba(" + t + ",0.85)");
  i.addColorStop(0.45, "rgba(" + n + ",0.4)");
  i.addColorStop(1, "rgba(0,0,0,0)");
  r.fillStyle = i;
  r.fillRect(0, 0, e, e);
  return new THREE.CanvasTexture(a);
}

const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlow(), transparent: true, depthWrite: false }));
glow.scale.set(480, 480, 1);
glow.position.set(0, 0, -5);
scene.add(glow);

// Rings (like planetary rings)
function ringTexture(e = 768) {
  const t = document.createElement("canvas");
  t.width = t.height = e;
  const n = t.getContext("2d");
  n.translate(e / 2, e / 2);
  const a = 0.34 * e,
        r = 0.49 * e,
        i = n.createRadialGradient(0, 0, 0.3 * a, 0, 0, r);
  i.addColorStop(0, "rgba(255,255,200,1)");
  i.addColorStop(0.3, "rgba(255,160,60,0.9)");
  i.addColorStop(0.65, "rgba(255,80,0,0.55)");
  i.addColorStop(1, "rgba(0,0,0,0)");
  n.fillStyle = i;
  n.beginPath();
  n.arc(0, 0, r, 0, 2 * Math.PI);
  n.arc(0, 0, a, 0, 2 * Math.PI, true);
  n.closePath();
  n.fill();
  return new THREE.CanvasTexture(t);
}

const ring1 = new THREE.Mesh(
  new THREE.RingGeometry(70, 95, 128),
  new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide })
);
const ring2 = new THREE.Mesh(
  new THREE.RingGeometry(100, 120, 128),
  new THREE.MeshBasicMaterial({ map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.55 })
);
ring1.rotation.x = ring2.rotation.x = Math.PI / 2;
scene.add(ring1);
scene.add(ring2);

// ===== PALABRAS PERSONALIZADAS =====
const baseWords = [
  "💖 Mi amor",
  "🌞 Mi sol",
  "🌎 Mi mundo",
  "✨ Brillas",
  "❤️ Te amo",
  "🌌 Mi universo",
  "👑 Mi reina",
  "🌠 Mi estrella",
  "💫 Mi cielo",
  "🔥 Siempre tú",
  "🎶 Tu risa",
  "🦋 Libertad",
  "💎 Eres todo",
  "🙏 Gracias",
  "💕 Mi cariño",
  "🌹 Amor eterno",
  "🤗 Mis abrazos",
  "🌸 Esperanza",
  "🌈 Mi alegría",
  "🌟 Contigo",
  "🧸 Ternura",
  "🎁 Mi razón",
  "🌙 Mi destino",
  "💌 Recuerdos",
  "🕊️ Mi paz",
  "🪐 Mi universo",
  "🌊 Mi calma",
  "💡 Mi luz",
  "🍒 Dulzura",
  "🥰 Mi vida",
  "🎇 Felicidad",
  "🌻 Mi alegría",
  "🌺 Mi flor",
  "💜 Mi eternidad",
  "🌟 Sueños",
  "✨ Magia",
  "🎵 Canción",
  "🔥 Pasión",
  "⭐ Mi estrella",
  "🌴 Mi paraíso",
  "🌄 Amanecer",
  "🌃 Noche contigo",
  "🎉 Mi fiesta",
  "💫 Inspiración",
  "🌷 Siempre juntos",
  "🎀 Mi ternura",
  "🍀 Mi fortuna",
  "🪞 Mi reflejo",
  "👵 Mi anciana",
  "🤪 Mi loquita",
  "😈 Mi grosera",
  "🎭 Mi dramática",
  "👧 Mi niña"
];

const WORDS = [];
for (let e = 0; e < 6; e++) WORDS.push(...baseWords);

function makeTextTexture(e, t) {
  const n = document.createElement("canvas");
  n.width = 512;
  n.height = 128;
  const a = n.getContext("2d");
  a.clearRect(0, 0, n.width, n.height);
  a.font = "bold 60px Arial";
  a.textAlign = "center";
  a.textBaseline = "middle";
  a.fillStyle = "#fff";
  a.shadowColor = t;
  a.shadowBlur = 30;
  a.fillText(e, n.width / 2, n.height / 2);
  return new THREE.CanvasTexture(n);
}

const COLORS = ["#ff66ff", "#66ccff", "#ffd36b", "#ff9966", "#8df59a", "#ffa0f8", "#c6a7ff", "#ff4444", "#44ff99", "#99ccff"];
const textGroup = new THREE.Group;
scene.add(textGroup);

for (let e = 0; e < WORDS.length; e++) {
  const t = makeTextTexture(WORDS[e], COLORS[e % COLORS.length]),
        n = new THREE.SpriteMaterial({ map: t, transparent: true }),
        a = new THREE.Sprite(n);
  a.scale.set(48, 15, 1);
  const r = Math.acos(2 * Math.random() - 1),
        i = Math.random() * Math.PI * 2,
        o = 160 + 130 * Math.random();
  a.position.set(o * Math.sin(r) * Math.cos(i), o * Math.cos(r), o * Math.sin(r) * Math.sin(i));
  a.userData = { phi: r, theta: i, radius: o, speed: 0.001 + 0.001 * Math.random() };
  textGroup.add(a);
}

// Controls
let dragging = false, lastX = 0, lastY = 0;

function onDown(e) {
  dragging = true;
  const t = e.touches ? e.touches[0] : e;
  lastX = t.clientX; lastY = t.clientY;
}
function onMove(e) {
  if (!dragging) return;
  const t = e.touches ? e.touches[0] : e,
        n = (t.clientX - lastX) / innerWidth,
        a = (t.clientY - lastY) / innerHeight;
  rotY -= 3 * n;
  rotX = Math.max(-1.2, Math.min(1.2, rotX - 2.2 * a));
  lastX = t.clientX; lastY = t.clientY;
}
function onUp() { dragging = false; }

addEventListener("mousedown", onDown);
addEventListener("mousemove", onMove);
addEventListener("mouseup", onUp);
addEventListener("touchstart", onDown, { passive: true });
addEventListener("touchmove", onMove, { passive: true });
addEventListener("touchend", onUp, { passive: true });
addEventListener("wheel", e => {
  targetDist += 0.25 * e.deltaY;
  targetDist = Math.max(180, Math.min(650, targetDist));
}, { passive: true });

let pinch = 0;
addEventListener("touchmove", e => {
  if (e.touches && 2 === e.touches.length) {
    e.preventDefault();
    const t = e.touches[0].clientX - e.touches[1].clientX,
          n = e.touches[0].clientY - e.touches[1].clientY,
          a = Math.hypot(t, n);
    if (pinch) {
      targetDist += 0.5 * (pinch - a);
      targetDist = Math.max(180, Math.min(650, targetDist));
    }
    pinch = a;
  }
}, { passive: false });
addEventListener("touchend", () => { pinch = 0 }, { passive: true });

// Animation
let t = 0;
function tick() {
  requestAnimationFrame(tick);
  t += 0.01;
  ring1.rotation.z += 0.0018;
  ring2.rotation.z -= 0.0012;
  glow.scale.set(480 * (1 + 0.025 * Math.sin(0.35 * t)), 480 * (1 + 0.025 * Math.sin(0.35 * t)), 1);
  
  // Very subtle pulse on the planet photo
  const pulse = 1 + 0.015 * Math.sin(1.8 * t);
  centerSprite.scale.set(PHOTO_SCALE * pulse, PHOTO_SCALE * pulse, 1);

  textGroup.children.forEach(e => {
    e.material.opacity = 0.75 + 0.25 * Math.sin(2 * t);
    e.userData.theta += e.userData.speed;
    e.position.x = e.userData.radius * Math.sin(e.userData.phi) * Math.cos(e.userData.theta);
    e.position.z = e.userData.radius * Math.sin(e.userData.phi) * Math.sin(e.userData.theta);
  });

  currentDist += 0.06 * (targetDist - currentDist);
  const n = Math.cos(rotX), a = Math.sin(rotX), r = Math.cos(rotY), i = Math.sin(rotY);
  camera.position.set(currentDist * i * n, currentDist * a, currentDist * r * n);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
tick();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
