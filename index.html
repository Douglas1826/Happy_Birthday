<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galaxia del Amor • Amelia</title>
<style>
body,html{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block}
.player{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:90%;max-width:600px;display:flex;align-items:center;gap:10px;padding:10px;border:2px solid #f60;border-radius:999px;background:0 0;box-shadow:0 0 15px #f60,0 0 30px #f30;z-index:1000;font-family:Arial,sans-serif;color:#fff;font-size:14px}
.player button{background:0 0;border:none;color:#fff;font-size:22px;cursor:pointer;filter:drop-shadow(0 0 6px #ff6600);transition:transform .2s}
.player button:hover{transform:scale(1.2);filter:drop-shadow(0 0 10px #ff3300)}
.progress{flex-grow:1;height:14px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;cursor:pointer;position:relative}
.progress-bar{height:100%;width:0%;background:linear-gradient(270deg,#f60,#f30,#f09,#f60);background-size:400% 400%;border-radius:999px;box-shadow:0 0 10px #f60;animation:flowing 6s ease infinite}
@keyframes flowing{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.time{min-width:74px;text-align:right;font-size:12px;color:#fff;text-shadow:0 0 5px #f60}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="player">
<button id="play">▶️</button>
<div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
<div class="time" id="time">0:00 / 0:00</div>
</div>
<audio id="audio" loop>
<source src="https://www.dropbox.com/scl/fi/18y29xvlz6emryvj66w7y/Emmanuel-Cortes-Amor-Letra-Lyrics.mp3?rlkey=qjh6jfktq9h6ymn9o1gqhpn1b&st=1p3vhmfd&raw=1" type="audio/mpeg">
</audio>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
const audio=document.getElementById("audio"),playBtn=document.getElementById("play"),progress=document.getElementById("progress"),progressBar=document.getElementById("progress-bar"),timeDisplay=document.getElementById("time");
let isPlaying=false;
function formatTime(e){if(!isFinite(e))return"0:00";return Math.floor(e/60)+":"+Math.floor(e%60).toString().padStart(2,"0")}
playBtn.addEventListener("click",async()=>{isPlaying?(audio.pause(),playBtn.textContent="▶️"):(await audio.play(),playBtn.textContent="⏸️");isPlaying=!isPlaying});
audio.addEventListener("timeupdate",()=>{const e=audio.currentTime/audio.duration*100;progressBar.style.width=(isFinite(e)?e:0)+"%";timeDisplay.textContent=formatTime(audio.currentTime)+" / "+formatTime(audio.duration)});
progress.addEventListener("click",e=>{const t=progress.getBoundingClientRect(),n=(e.clientX-t.left)/t.width;if(isFinite(audio.duration))audio.currentTime=n*audio.duration});

const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300,currentDist=300,rotX=0.2,rotY=0;

const loader=new THREE.TextureLoader();
const nebulaTex=loader.load("https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/cube/space/px.jpg");
scene.background=nebulaTex;

// Stars (original style)
(function(count=2000,maxR=3000){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=maxR*(0.3+0.7*Math.random());
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// NO solid core sphere → this is what caused the black lines when rotating
// The photo itself acts as the center

// Glow (original style)
function makeGlow(size=768,c1="255,160,0",c2="255,60,0"){
  const c=document.createElement("canvas");
  c.width=c.height=size;
  const ctx=c.getContext("2d");
  const g=ctx.createRadialGradient(size/2,size/2,0.05*size,size/2,size/2,0.5*size);
  g.addColorStop(0,"rgba("+c1+",0.9)");
  g.addColorStop(0.5,"rgba("+c2+",0.5)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.scale.set(500,500,1);
scene.add(glow);

// Rings (original distances and look)
function ringTexture(size=768){
  const c=document.createElement("canvas");
  c.width=c.height=size;
  const ctx=c.getContext("2d");
  ctx.translate(size/2,size/2);
  const a=0.34*size,r=0.49*size;
  const g=ctx.createRadialGradient(0,0,0.3*a,0,0,r);
  g.addColorStop(0,"rgba(255,255,200,1)");
  g.addColorStop(0.3,"rgba(255,160,60,0.9)");
  g.addColorStop(0.65,"rgba(255,80,0,0.6)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.arc(0,0,a,0,Math.PI*2,true);
  ctx.closePath();
  ctx.fill();
  return new THREE.CanvasTexture(c);
}
const ring1=new THREE.Mesh(
  new THREE.RingGeometry(90,115,128),
  new THREE.MeshBasicMaterial({map:ringTexture(),transparent:true,side:THREE.DoubleSide,depthWrite:false})
);
const ring2=new THREE.Mesh(
  new THREE.RingGeometry(125,145,128),
  new THREE.MeshBasicMaterial({map:ringTexture(),transparent:true,side:THREE.DoubleSide,opacity:0.55,depthWrite:false})
);
ring1.rotation.x=ring2.rotation.x=Math.PI/2;
scene.add(ring1);
scene.add(ring2);

const centerMat=new THREE.SpriteMaterial({
  map:centerTex,
  transparent:true,
  depthWrite:false,
  depthTest:false
});
const centerSprite=new THREE.Sprite(centerMat);
const PHOTO_SCALE=95;
centerSprite.scale.set(PHOTO_SCALE,PHOTO_SCALE,1);
centerSprite.position.set(0,0,0);
centerSprite.renderOrder=999;
scene.add(centerSprite);

// ===== Personalized words =====
const baseWords=["👵🏻 Mi anciana", "💖 Mi amor", "🌞 Mi sol", "🌎 Mi mundo", "✨ Brillas", "❤️ Te amo", "🌌 Mi universo", "👑 Mi reina", "🌠 Mi estrella", "💫 Mi cielo", "🔥 Mi pasión", "🎶 Mi risa", "🦋 Mi libertad", "💎 Eres todo", "🙏 Mi gracias", "💕 Mi cariño", "🌹Mi amor eterno", "🤗 Mis abrazos", "🌸 Mi esperanza", "🌈 Mi alegría", "🌟 Siempre contigo", "🧸 Mi ternura", "🎁 Mi razón", "🌙 Mi destino", "💌 Mis recuerdos", "🕊️ Mi paz", "🪐 Mi universo", "🌊 Mi calma", "💡 Mi luz", "🍒 Mi dulzura", "🥰 Mi vida", "🎇 Mi felicidad", "🌻 Mi alegría", "🌺 Mi flor", "💜 Mi eternidad", "🌟 Mi sueños", "✨ Mi magia", "🎵 Mi canción", "⭐ Mi estrella", "🌴 Mi paraíso", "🌄 Amanecer", "🫪 Agresiva", "🎉 Mi fiesta", "💫 Mi inspiración", "🌷 Siempre juntos", "🎀 Mi ternura", "🍀 Mi fortuna", "🪞 Mi reflejo", "🤪 Mi loquita", "😈 Mi grosera", "🎭 Mi dramática", "👧 Mi niña", "🔥 Siempre tú"];
const WORDS=[];
for(let i=0;i<6;i++) WORDS.push(...baseWords);

function makeTextTexture(text,color){
  const c=document.createElement("canvas");
  c.width=512;c.height=128;
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.font="bold 60px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#fff";
  ctx.shadowColor=color;
  ctx.shadowBlur=30;
  ctx.fillText(text,c.width/2,c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS=["#ff66ff","#66ccff","#ffd36b","#ff9966","#8df59a","#ffa0f8","#c6a7ff","#ff4444","#44ff99","#99ccff"];
const textGroup=new THREE.Group();
scene.add(textGroup);
for(let i=0;i<WORDS.length;i++){
  const tex=makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(50,16,1);
  const phi=Math.acos(2*Math.random()-1);
  const theta=Math.random()*Math.PI*2;
  const radius=160+120*Math.random();
  sp.position.set(radius*Math.sin(phi)*Math.cos(theta),radius*Math.cos(phi),radius*Math.sin(phi)*Math.sin(theta));
  sp.userData={phi,theta,radius,speed:0.001+0.001*Math.random()};
  textGroup.add(sp);
}

// Controls (original)
let dragging=false,lastX=0,lastY=0;
function onDown(e){dragging=true;const t=e.touches?e.touches[0]:e;lastX=t.clientX;lastY=t.clientY}
function onMove(e){
  if(!dragging)return;
  const t=e.touches?e.touches[0]:e;
  const n=(t.clientX-lastX)/innerWidth,a=(t.clientY-lastY)/innerHeight;
  rotY-=3*n;rotX=Math.max(-1.2,Math.min(1.2,rotX-2.2*a));
  lastX=t.clientX;lastY=t.clientY;
}
function onUp(){dragging=false}
addEventListener("mousedown",onDown);
addEventListener("mousemove",onMove);
addEventListener("mouseup",onUp);
addEventListener("touchstart",onDown,{passive:true});
addEventListener("touchmove",onMove,{passive:true});
addEventListener("touchend",onUp,{passive:true});
addEventListener("wheel",e=>{targetDist+=0.25*e.deltaY;targetDist=Math.max(160,Math.min(600,targetDist))},{passive:true});

let pinch=0;
addEventListener("touchmove",e=>{
  if(e.touches&&e.touches.length===2){
    e.preventDefault();
    const t=e.touches[0].clientX-e.touches[1].clientX,n=e.touches[0].clientY-e.touches[1].clientY;
    const a=Math.hypot(t,n);
    if(pinch){targetDist+=0.5*(pinch-a);targetDist=Math.max(160,Math.min(600,targetDist))}
    pinch=a;
  }
},{passive:false});
addEventListener("touchend",()=>{pinch=0},{passive:true});

// Animation (original style, no core)
let t=0;
function tick(){
  requestAnimationFrame(tick);
  t+=0.01;
  ring1.rotation.z+=0.002;
  ring2.rotation.z-=0.0015;
  glow.scale.set(500*(1+0.03*Math.sin(0.4*t)),500*(1+0.03*Math.sin(0.4*t)),1);

  // Soft pulse on photo
  const p=1+0.02*Math.sin(2*t);
  centerSprite.scale.set(PHOTO_SCALE*p,PHOTO_SCALE*p,1);

  textGroup.children.forEach(e=>{
    e.material.opacity=0.8+0.2*Math.sin(2*t);
    e.userData.theta+=e.userData.speed;
    e.position.x=e.userData.radius*Math.sin(e.userData.phi)*Math.cos(e.userData.theta);
    e.position.z=e.userData.radius*Math.sin(e.userData.phi)*Math.sin(e.userData.theta);
  });

  currentDist+=0.06*(targetDist-currentDist);
  const n=Math.cos(rotX),a=Math.sin(rotX),r=Math.cos(rotY),i=Math.sin(rotY);
  camera.position.set(currentDist*i*n,currentDist*a,currentDist*r*n);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
